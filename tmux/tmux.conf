# List of tmux plugins.
# Will be installed by tpm, see bottom of the file.
set -g @plugin 'tmux-plugins/tpm'

# A set of "good enough" defaults for tmux.
# https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-sensible'

# This should fix the color issues with Helix within a tmux session
# using Alacritty.
#
# All the $hit that didn't work:
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6#tmux
# set -g default-terminal "tmux-256color"
# set -g default-terminal "xterm-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
# set-option -sa terminal-overrides ",xterm*:Tc"
# https://jdhao.github.io/2018/10/19/tmux_nvim_true_color/
set -g default-terminal "tmux-256color"
# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"

set-option -g default-shell /bin/zsh

# I need to verify if this is still needed...
unbind-key N
unbind-key n

# Start panes and windows from 1 instead of 0.
# By default they start at zero, but the 0 key is
# on the other side of the keyboard and it's annoying to type.
# https://unix.stackexchange.com/questions/35924/how-to-make-tmux-count-windows-starting-from-1-instead-of-0
set -g base-index 1
setw -g pane-base-index 1

# Default display time for notifications is very short,
# so let's increase it so that we can read the message.
#
# https://superuser.com/questions/295736/tmux-status-bar-messages-last-only-about-a-second-can-i-extend-this
set-option -g display-time 2000

# Prefix+b will automatically reload the tmux configuration in current session.
# Then, it will display a notification at the bottom of the screen,
# which now with the custom display time is actually readable.
#
# https://www.youtube.com/watch?v=-f9rz7joEOA&t=362s
bind-key b source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration is reloaded 🔃"

# Enable mouse mode.
# Mouse mode allows you to pick panes using the mouse, resize panes,
# select windows, select options, and so on.
#
# It's more beginner friendly (helps you get unstuck if needed)
# and in some cases, it just works better
# than their keyboard equivalent (resizing panes).
#
# https://www.youtube.com/watch?v=-f9rz7joEOA&t=480s
set -g mouse on


### WORKING WITH SESSIONS ###

# Create new session.
bind-key N new-session

# Rename session.
bind-key R command-prompt -p "Rename session: " "rename-session '%%'"

# Close session.
bind-key Q kill-session


### WORKING WITH WINDOWS ###

# Create new window.
bind-key n new-window

# Rename window (with a custom prompt).
bind-key r command-prompt -p "Rename window: " "rename-window '%%'"

# Close window.
bind-key q kill-window

# Use shift+up/down arrows (as in hjkl) to switch windows.
bind-key K next-window
bind-key J previous-window

# These would work but having two commands for the same thing
# ensures that I learn neither.
# bind-key Tab next-window
bind-key S-Tab previous-window # this doesn't work


### WORKING WITH PANES ###

# Open panes vertically or horizontally.
bind-key v split-window -v
bind-key h split-window -h

# Use hjkl to move around the panes.
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

# Close pane.
bind-key x kill-pane

# Initialize tmux plugin manager
# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
